<!DOCTYPE html>
<html>
<head>
    <title>My Profile | Smart Resume</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .row {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

    <h1>My Profile</h1>

    <div class="card">

        <div class="row">
            <div class="label">Full Name</div>
            <div class="value">
                {{ request.user.first_name }}
            </div>
        </div>

        <div class="row">
            <div class="label">Username</div>
            <div class="value">
                {{ request.user.username }}
            </div>
        </div>

        <div class="row">
            <div class="label">Email</div>
            <div class="value">
                {{ request.user.email }}
            </div>
        </div>

        <div class="row">
            <div class="label">Account Type</div>
            <div class="value">
                {{ profile.role|title }}
            </div>
        </div>

    </div>

</div>

</body>
</html>
